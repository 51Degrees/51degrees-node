name: tmp licence key tests
on:
  push:
    branches: ['tmp/lko-node-*']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund --workspace pipeline/fiftyone.pipeline.cloudrequestengine --include-workspace-root
      - run: npx jest --ci --runInBand --forceExit pipeline/fiftyone.pipeline.cloudrequestengine/tests --testPathIgnorePatterns=integration
      - run: npx eslint pipeline/fiftyone.pipeline.cloudrequestengine --ext .js
