name: Temporary red run tmp/node-45-red3
on:
  push:
    branches:
      - 'tmp/node-45-red3'
jobs:
  Test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init pipeline/fiftyone.pipeline.core/javascript-templates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: git log --oneline -2
      - run: node --expose-gc node_modules/jest/bin/jest.js --ci --runInBand --forceExit pipeline/fiftyone.pipeline.core/tests/acceptedEvidence.test.js pipeline/fiftyone.pipeline.core/tests/elementDefaultEvidence.test.js pipeline/fiftyone.pipeline.core/tests/javascriptbuilder.test.js
