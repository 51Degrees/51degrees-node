name: Temporary SWIG wrapper generation for 51degrees-cxx 4.5.101

# Temporary. Runs on a push to this branch only and is deleted once it has
# committed. It builds SWIG 4.5.0 from the v4.5.0 tag and from the
# node-24-holder-this branch of the 51Degrees fork, which the READMEs name,
# shows which build reproduces the committed wrappers byte for byte, and
# commits that build's wrappers with cxx moved to 4.5.101.

on:
  push:
    branches:
      - 'feature/cxx-4.5.101'

permissions:
  contents: write

jobs:
  Generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM_URL: https://github.com/swig/swig.git
      UPSTREAM_REF: refs/tags/v4.5.0
      UPSTREAM_SHA: d598176759f5d199e288cf78413cfaa3bf84449f
      FORK_URL: https://github.com/51Degrees/swig.git
      FORK_REF: refs/heads/node-24-holder-this
      FORK_SHA: 48753552ee7d0e0f886f9d624f761a501ce70b64
      # The cxx commit main pointed at before 4.5.100. Its interfaces are the
      # last ones the committed wrappers could have been generated from.
      CXX_PREVIOUS: e171da52f0f36e355746ee6126d3e0b69cd05b15
      # 4.5.100, where cxx points on main.
      CXX_100: 4110d6813e167a803a06489318b33b83a230fa32
      # Head of the 4.5.101 release pull request.
      CXX_101: 4e023aaa5c1f5ec56d475c75a91761d8ef55dc20
      DD: device-detection/fiftyone.devicedetection.onpremise
      IPI: ip-intelligence/fiftyone.ipintelligence.onpremise
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Confirm the starting point
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
          git submodule status
          test "$(git -C cxx rev-parse HEAD)" = "$CXX_100"

      - name: Install the SWIG build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y automake bison libpcre2-dev

      - name: Build SWIG from the v4.5.0 tag
        run: |
          set -euo pipefail
          unset SWIG_LIB
          src="$RUNNER_TEMP/src-upstream"
          prefix="$RUNNER_TEMP/swig-upstream"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 "$UPSTREAM_URL" "$UPSTREAM_REF"
          got="$(git -C "$src" rev-parse 'FETCH_HEAD^{commit}')"
          echo "$UPSTREAM_URL $UPSTREAM_REF is commit $got"
          test "$got" = "$UPSTREAM_SHA"
          git -C "$src" checkout -q "$got"
          cd "$src"
          ./autogen.sh
          ./configure --prefix="$prefix"
          make -j"$(nproc)"
          make install
          "$prefix/bin/swig" -version
          "$prefix/bin/swig" -swiglib

      - name: Build SWIG from the node-24-holder-this branch of the fork
        run: |
          set -euo pipefail
          unset SWIG_LIB
          src="$RUNNER_TEMP/src-fork"
          prefix="$RUNNER_TEMP/swig-fork"
          echo "$FORK_URL $FORK_REF is now $(git ls-remote "$FORK_URL" "$FORK_REF")"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 "$FORK_URL" "$FORK_SHA"
          got="$(git -C "$src" rev-parse 'FETCH_HEAD^{commit}')"
          echo "Building commit $got"
          test "$got" = "$FORK_SHA"
          git -C "$src" checkout -q "$got"
          cd "$src"
          ./autogen.sh
          ./configure --prefix="$prefix"
          make -j"$(nproc)"
          make install
          "$prefix/bin/swig" -version
          "$prefix/bin/swig" -swiglib

      - name: Write the shared functions
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/functions.sh" <<'EOF'
          checkout_cxx() {
            git -C cxx fetch -q --depth 1 origin "$1"
            git -C cxx checkout -q --detach "$1"
            test "$(git -C cxx rev-parse HEAD)" = "$1"
            echo "cxx is at $(git -C cxx rev-parse HEAD)"
          }
          # The commands in the README, run in place with the named build first
          # on the PATH.
          generate() {
            local bin="$RUNNER_TEMP/swig-$1/bin"
            (
              export PATH="$bin:$PATH"
              unset SWIG_LIB
              echo "swig is $(command -v swig)"
              cd "$DD"
              swig -c++ -javascript -node hash_node.i
              cd ../../ip-intelligence/fiftyone.ipintelligence.onpremise
              swig -c++ -javascript -node ipi_node.i
            )
          }
          EOF
          cat "$RUNNER_TEMP/functions.sh"

      - name: Generate with each build at each cxx commit and compare
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/functions.sh"
          OUT="$RUNNER_TEMP/swig-out"
          mkdir -p "$OUT/committed" "$OUT/diffs"
          git show "HEAD:$DD/hash_node_wrap.cxx" > "$OUT/committed/hash_node_wrap.cxx"
          git show "HEAD:$IPI/ipi_node_wrap.cxx" > "$OUT/committed/ipi_node_wrap.cxx"
          for b in upstream fork; do
            "$RUNNER_TEMP/swig-$b/bin/swig" -version > "$OUT/swig-version-$b.txt"
            for c in "$CXX_PREVIOUS" "$CXX_100" "$CXX_101"; do
              s="$b-${c:0:8}"
              echo "::group::$s"
              checkout_cxx "$c"
              generate "$b" 2>&1 | tee "$OUT/$s.log.txt"
              mkdir -p "$OUT/$s"
              cp "$DD/hash_node_wrap.cxx" "$IPI/ipi_node_wrap.cxx" "$OUT/$s/"
              git checkout -q -- "$DD/hash_node_wrap.cxx" "$IPI/ipi_node_wrap.cxx"
              for f in hash_node_wrap.cxx ipi_node_wrap.cxx; do
                if cmp -s "$OUT/committed/$f" "$OUT/$s/$f"; then r=identical; else r=differs; fi
                echo "$s $f $r" >> "$OUT/summary.txt"
                diff -u "$OUT/committed/$f" "$OUT/$s/$f" \
                  > "$OUT/diffs/committed-vs-$s-$f.diff" || true
              done
              echo "::endgroup::"
            done
          done
          for f in hash_node_wrap.cxx ipi_node_wrap.cxx; do
            for pair in \
              "fork-${CXX_PREVIOUS:0:8} fork-${CXX_100:0:8}" \
              "fork-${CXX_100:0:8} fork-${CXX_101:0:8}" \
              "upstream-${CXX_100:0:8} upstream-${CXX_101:0:8}" \
              "fork-${CXX_101:0:8} upstream-${CXX_101:0:8}"; do
              set -- $pair
              diff -u "$OUT/$1/$f" "$OUT/$2/$f" > "$OUT/diffs/$1-vs-$2-$f.diff" || true
            done
          done
          echo "Byte for byte comparison with the committed wrappers"
          cat "$OUT/summary.txt"
          echo "Changed lines in each diff (lines starting + or -, headers included)"
          for d in "$OUT"/diffs/*.diff; do
            printf '%8s %s\n' "$(grep -c '^[-+]' "$d" || true)" "$(basename "$d")"
          done | tee "$OUT/diff-sizes.txt"
          {
            echo '### Byte for byte comparison with the committed wrappers'
            echo '```'
            cat "$OUT/summary.txt"
            echo '```'
            echo '### Changed lines in each diff'
            echo '```'
            cat "$OUT/diff-sizes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          chosen=""
          reproduced=""
          for b in upstream fork; do
            for c in "$CXX_PREVIOUS" "$CXX_100"; do
              s="$b-${c:0:8}"
              if grep -qx "$s hash_node_wrap.cxx identical" "$OUT/summary.txt" &&
                 grep -qx "$s ipi_node_wrap.cxx identical" "$OUT/summary.txt"; then
                chosen="$b"
                reproduced="$c"
                break 2
              fi
            done
          done
          echo "Build that reproduces the committed wrappers: ${chosen:-none}, with cxx at ${reproduced:-none}" \
            | tee "$OUT/chosen.txt"
          echo "CHOSEN=$chosen" >> "$GITHUB_ENV"
          echo "REPRODUCED_AT=$reproduced" >> "$GITHUB_ENV"

      - name: Commit the wrappers for 4.5.101 with cxx moved
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/functions.sh"
          OUT="$RUNNER_TEMP/swig-out"
          if [ -z "$CHOSEN" ]; then
            echo "No build reproduced the committed wrappers byte for byte, so nothing is committed."
            exit 1
          fi
          if [ "$CHOSEN" = upstream ]; then
            source_line="$UPSTREAM_URL at $UPSTREAM_REF, commit $UPSTREAM_SHA"
          else
            source_line="$FORK_URL at $FORK_REF, commit $FORK_SHA"
          fi
          checkout_cxx "$CXX_101"
          generate "$CHOSEN"
          cmp "$DD/hash_node_wrap.cxx" "$OUT/$CHOSEN-${CXX_101:0:8}/hash_node_wrap.cxx"
          cmp "$IPI/ipi_node_wrap.cxx" "$OUT/$CHOSEN-${CXX_101:0:8}/ipi_node_wrap.cxx"
          git add cxx "$DD/hash_node_wrap.cxx" "$IPI/ipi_node_wrap.cxx"
          git status --porcelain
          test -z "$(git status --porcelain | grep -v '^M  ' || true)"
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = \
            "cxx $DD/hash_node_wrap.cxx $IPI/ipi_node_wrap.cxx "
          {
            echo "Generate the SWIG wrappers again for 51degrees-cxx 4.5.101"
            echo
            echo "51degrees-cxx 4.5.101 removes the process overloads that take required"
            echo "property indexes. The committed wrappers call them, so the native modules"
            echo "stop compiling once cxx moves. This moves cxx to $CXX_101,"
            echo "the head of the 4.5.101 release pull request, and generates both wrappers"
            echo "again with the commands in the README."
            echo
            echo "SWIG is 4.5.0 built from $source_line."
            echo "With cxx at $REPRODUCED_AT the same commands give the committed wrappers"
            echo "byte for byte."
            if [ "$REPRODUCED_AT" != "$CXX_100" ]; then
              echo
              echo "The committed wrappers match the interfaces at $REPRODUCED_AT,"
              echo "not 4.5.100, so the new wrappers also carry what 4.5.100 added to the"
              echo "interfaces."
            fi
          } > "$OUT/commit-message.txt"
          cat "$OUT/commit-message.txt"
          export GIT_AUTHOR_NAME="James Rosewell"
          export GIT_AUTHOR_EMAIL="james@51degrees.com"
          export GIT_COMMITTER_NAME="James Rosewell"
          export GIT_COMMITTER_EMAIL="james@51degrees.com"
          git commit -q -F "$OUT/commit-message.txt"
          git show --stat --format=fuller HEAD
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD | tee "$OUT/pushed-commit.txt"

      - name: Upload the outputs and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swig-wrappers
          path: ${{ runner.temp }}/swig-out
          if-no-files-found: error
