name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test
# (pipeline/fiftyone.pipeline.did/tests/didClient.integration.test.js) once for every
# _51DEGREES_RESOURCE_KEY* key passed in below. Each run sets the single
# _51DEGREES_RESOURCE_KEY the test reads. Only keys that carry the FODid
# product, and the CloudV5FODiD product for the marketing usages, are passed
# to that loop, because the test fails when a key gets no 51Did. The Basic
# key is refused the marketing usages, so it runs only the tier test
# (tests/tierEntitlement.integration.test.js), which checks that refusal.
#
# The secrets are named one by one rather than passed as toJSON(secrets).
# GitHub marks a workflow that hands every secret to a step as possibly
# malicious and holds each run for manual approval, so the nightly never ran.
# A new resource key therefore needs a line here as well as the organisation
# secret.
#
# A run with no key fails. A cloud test that passes without calling the
# cloud has proved nothing. A pull request from a fork gets no secrets, so
# run this workflow from a branch in this repository.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. That is what happened when the cloud service began
  # writing the Terms byte. The six 51Did packages are
  # staggered ten minutes apart so they do not all ask production at once.
  schedule:
    - cron: '20 5 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'pipeline/fiftyone.pipeline.did/**'
      - '.github/workflows/cloud-51did.yml'

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/fiftyone.pipeline.did
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        # The package takes owid from a pinned GitHub reference rather than
        # from the registry, so the install needs the network and no
        # submodule checkout.
        run: npm install --no-audit --no-fund
      - name: Cloud 51Did test for each resource key secret
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY_BESPOKE: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
          _51DEGREES_RESOURCE_KEY_51DID: ${{ vars._51DEGREES_RESOURCE_KEY_51DID }}
          # A license key redeems only with a resource key of the same
          # account, so each is paired with the resource key of the same
          # suffix. With any other resource key the cloud answers unreadable
          # whatever the result, and the redeem would prove nothing.
          _51DEGREES_LICENSE_KEY_51DID: ${{ secrets._51DEGREES_LICENSE_KEY_51DID }}
        run: |
          $keys = Get-ChildItem env: |
            Where-Object { $_.Name -like '_51DEGREES_RESOURCE_KEY*' -and $_.Value }
          if (-not $keys) {
            Write-Host '::error::No _51DEGREES_RESOURCE_KEY* secret reached this job. The tests need a key that carries the FODid product, and the CloudV5FODiD product for the marketing usages.'
            exit 1
          }
          # Taken out of the environment so the test only sees the one that
          # matches the resource key of each pass.
          $licenses = @{}
          Get-ChildItem env: |
            Where-Object { $_.Name -like '_51DEGREES_LICENSE_KEY_*' } |
            ForEach-Object {
              if ($_.Value) { $licenses[$_.Name] = $_.Value }
              Remove-Item "env:$($_.Name)"
            }
          $failed = $false
          foreach ($k in $keys) {
            Write-Host "::group::didClient.integration with $($k.Name)"
            $env:_51DEGREES_RESOURCE_KEY = $k.Value
            $licenseName = $k.Name -replace '^_51DEGREES_RESOURCE_KEY', '_51DEGREES_LICENSE_KEY'
            if ($licenses.ContainsKey($licenseName)) {
              $env:_51DEGREES_LICENSE_KEY_51DID = $licenses[$licenseName]
              Write-Host "License key for redeem: $licenseName"
            } else {
              Remove-Item env:_51DEGREES_LICENSE_KEY_51DID -ErrorAction Ignore
              Write-Host 'License key for redeem: none'
            }
            npx jest tests/didClient.integration.test.js
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
      - name: Cloud 51Did tier test with the Basic key
        # Runs even when the loop above failed, so a run reports both.
        if: ${{ !cancelled() }}
        env:
          _51DEGREES_RESOURCE_KEY_BASIC: ${{ vars._51DEGREES_RESOURCE_KEY_BASIC }}
        run: npx jest tests/tierEntitlement.integration.test.js
