name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test
# (pipeline/fiftyone.pipeline.did/tests/didClient.integration.test.js) with
# the 51Did resource key passed in below, and the license of the same
# account. The key carries the FODid product, and the CloudV5FODiD product
# for the marketing usages. The Basic key is
# refused the marketing usages, so it runs only the tier test
# (tests/tierEntitlement.integration.test.js), which checks that refusal.
#
# Each step is given only the keys its test reads, under their own names,
# from the organization secrets of the same names.
#
# A run with no key fails. A cloud test that passes without calling the
# cloud has proved nothing. A pull request from a fork gets no secrets, so
# run this workflow from a branch in this repository.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. That is what happened when the cloud service began
  # writing the Terms byte. The six 51Did packages are
  # staggered ten minutes apart so they do not all ask production at once.
  schedule:
    - cron: '20 5 * * *'
  pull_request:
    branches: [main, rc]
    paths:
      - 'pipeline/fiftyone.pipeline.did/**'
      - '.github/workflows/cloud-51did.yml'

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/fiftyone.pipeline.did
    env:
      # Unset means the public cloud service.
      _51DEGREES_CLOUD_ENDPOINT: ${{ vars._51DEGREES_CLOUD_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OWID
        # The package requires ./owid-js/v1.js from the owid-js submodule,
        # and the other submodules are not needed here.
        run: git submodule update --init owid-js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Cloud 51Did test with the 51Did resource key
        env:
          _51DEGREES_RESOURCE_KEY_51DID: ${{ secrets._51DEGREES_RESOURCE_KEY_51DID }}
          # Redeems with the 51Did resource key, which is of the same account.
          _51DEGREES_LICENSE_KEY_51DID: ${{ secrets._51DEGREES_LICENSE_KEY_51DID }}
        run: npx jest tests/didClient.integration.test.js
      - name: Cloud 51Did tier test with the Basic key
        # Runs even when the step above failed, so a run reports both.
        if: ${{ !cancelled() }}
        env:
          _51DEGREES_RESOURCE_KEY_BASIC: ${{ secrets._51DEGREES_RESOURCE_KEY_BASIC }}
        run: npx jest tests/tierEntitlement.integration.test.js
