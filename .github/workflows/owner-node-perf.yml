name: Owner node perf rc against main

# Temporary. Measures main and the release head on one ARM runner, taking
# turns with the order turning each round, for Device Detection and IP
# Intelligence on premise, with each tree's own performance scripts.
# Delete this branch when the figures are recorded.

on:
  push:
    branches:
      - 'tmp/owner-node-perf-*'

jobs:
  Measure:
    name: perf Ubuntu_ARM_Node_24
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout Common
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/common-ci
          path: common

      - name: Install Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout m0, main
        uses: actions/checkout@v4
        with:
          ref: 4d5832f046b3522300d80fcfbdf2652932d3eed9
          submodules: recursive
          path: m0

      - name: Checkout h0, the release head
        uses: actions/checkout@v4
        with:
          ref: 7004cc658446e2d851630aac94d80cecaa56e3b2
          submodules: recursive
          path: h0

      - name: Runner
        shell: pwsh
        run: |
          uname -a
          nproc
          free -m
          df -h .
          lscpu | Select-String 'Model name|^CPU\(s\)|Vendor'
          node --version
          foreach ($arm in 'm0','h0') {
            Write-Output "$arm $(git -C $arm rev-parse HEAD) cxx $(git -C $arm/cxx rev-parse HEAD)"
          }

      # The licensed files come from today's asset cache on main, which a
      # branch can restore, so nothing is downloaded.
      - name: Restore the asset cache
        uses: actions/cache/restore@v5
        with:
          key: owner-node-none
          restore-keys: '20261115-'
          path: assets
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: List the data files and the evidence
        shell: pwsh
        run: Get-ChildItem assets | Select-Object Name, Length

      - name: Make the IP Intelligence evidence
        shell: pwsh
        run: |
          # The same generator and counts as ci/fetch-assets.ps1, made once so
          # that every arm reads the same addresses.
          Push-Location m0/cxx/data/ip-intelligence
          try {
            ./evidence-gen.ps1 -v4 10000 -v6 10000 -csv -path "$env:GITHUB_WORKSPACE/ipi-evidence.csv"
          } finally { Pop-Location }
          Write-Output "lines $((Get-Content ipi-evidence.csv).Count)"

      - name: Build both trees
        shell: pwsh
        run: |
          $native = @(
            @{ Path = 'device-detection/fiftyone.devicedetection.onpremise'; Module = 'FiftyOneDeviceDetectionHashV4' }
            @{ Path = 'ip-intelligence/fiftyone.ipintelligence.onpremise'; Module = 'FiftyOneIpIntelligenceIpiV41' }
          )
          foreach ($arm in 'm0','h0') {
            Write-Output "::group::build $arm"
            # build-extension.ps1 writes a copy to a package-files folder
            # beside the tree, which both trees share, so it is cleared first.
            Remove-Item -Recurse -Force package-files -ErrorAction Ignore
            Push-Location $arm
            try {
              npm install
              if ($LASTEXITCODE) { throw "npm install failed in $arm" }
              foreach ($p in $native) {
                Push-Location $p.Path
                try {
                  & "$env:GITHUB_WORKSPACE/$arm/ci/build-extension.ps1" -PackageName $p.Path -ModuleName $p.Module
                } finally { Pop-Location }
              }
            } finally { Pop-Location }
            Write-Output "::endgroup::"
            Get-ChildItem "$arm/device-detection/fiftyone.devicedetection.onpremise/build/*.node", "$arm/ip-intelligence/fiftyone.ipintelligence.onpremise/build/*.node" |
              ForEach-Object { Write-Output ("BINARY {0} {1} {2} {3}" -f $arm, $_.Name, $_.Length, (Get-FileHash $_.FullName).Hash) }
          }
          # The IP Intelligence performance scripts differ between the trees,
          # so main's script also runs against the head's packages, as arm hm.
          $folder = 'ip-intelligence/fiftyone.ipintelligence.onpremise/examples/onpremise/performance-console'
          Copy-Item "m0/$folder/performance.js" "h0/$folder/performance-main.js"
          Get-FileHash "m0/$folder/performance.js", "h0/$folder/performance.js", "h0/$folder/performance-main.js" |
            ForEach-Object { Write-Output ("SCRIPT {0} {1}" -f $_.Hash, $_.Path) }

      - name: Measure
        shell: pwsh
        run: |
          $ddData = (Resolve-Path 'assets/TAC-HashV41.hash').Path
          $ddEvidence = (Resolve-Path 'assets/20000 User Agents.csv').Path
          $ipiData = (Resolve-Path 'assets/51Degrees-EnterpriseIpiV41.ipi').Path
          $ipiEvidence = (Resolve-Path 'ipi-evidence.csv').Path
          Write-Output "DD data $((Get-Item $ddData).Length) bytes, evidence $((Get-Item $ddEvidence).Length) bytes"
          Write-Output "IPI data $((Get-Item $ipiData).Length) bytes, evidence $((Get-Item $ipiEvidence).Length) bytes"
          $ddScript = 'device-detection/fiftyone.devicedetection.onpremise/examples/onpremise/performance-console/performance.js'
          $ipiFolder = 'ip-intelligence/fiftyone.ipintelligence.onpremise/examples/onpremise/performance-console'
          $measures = [ordered]@{
            DD = @(
              @{ Name = 'm0'; Tree = 'm0'; Script = $ddScript; Data = $ddData; Evidence = $ddEvidence }
              @{ Name = 'h0'; Tree = 'h0'; Script = $ddScript; Data = $ddData; Evidence = $ddEvidence }
            )
            IPI = @(
              @{ Name = 'm0'; Tree = 'm0'; Script = "$ipiFolder/performance.js"; Data = $ipiData; Evidence = $ipiEvidence }
              @{ Name = 'h0'; Tree = 'h0'; Script = "$ipiFolder/performance.js"; Data = $ipiData; Evidence = $ipiEvidence }
              @{ Name = 'hm'; Tree = 'h0'; Script = "$ipiFolder/performance-main.js"; Data = $ipiData; Evidence = $ipiEvidence }
            )
          }
          $rounds = 21
          $results = @{}
          foreach ($m in $measures.Keys) {
            foreach ($a in $measures[$m]) { $results["$m $($a.Name)"] = [double[]]::new($rounds) }
          }
          foreach ($round in 1..$rounds) {
            foreach ($m in $measures.Keys) {
              $arms = $measures[$m]
              # The order turns each round so that no arm is always first.
              $order = @(0..($arms.Count - 1) | ForEach-Object { $arms[($_ + $round - 1) % $arms.Count] })
              Write-Output "round $round $m order $(($order | ForEach-Object { $_.Name }) -join ' ')"
              foreach ($a in $order) {
                Push-Location $a.Tree
                try {
                  Remove-Item out.json -ErrorAction Ignore
                  $log = node $a.Script --datafile $a.Data --evidence $a.Evidence --jsonoutput out.json
                  if ($LASTEXITCODE) {
                    $log | Select-Object -Last 30
                    throw "$m $($a.Name) round $round exited $LASTEXITCODE"
                  }
                  $value = (Get-Content out.json | ConvertFrom-Json).HigherIsBetter.DetectionsPerSecond
                  if ($null -eq $value) { throw "$m $($a.Name) round $round gave no figure" }
                  $results["$m $($a.Name)"][$round - 1] = [double]$value
                  Write-Output ("ROUND {0} {1} {2} {3:F2}" -f $round, $m, $a.Name, $value)
                  if ($round -eq 1) {
                    $log | Select-String 'known|unknown|Processing|Average|Enterprise|Lite' |
                      ForEach-Object { Write-Output "  $($_.Line.Trim())" }
                  }
                } finally { Pop-Location }
              }
            }
          }
          function Get-Quantile([double[]]$Sorted, [double]$P) {
            $pos = $P * ($Sorted.Count - 1)
            $lo = [int][math]::Floor($pos)
            $hi = [int][math]::Ceiling($pos)
            return $Sorted[$lo] + ($Sorted[$hi] - $Sorted[$lo]) * ($pos - $lo)
          }
          foreach ($key in ($results.Keys | Sort-Object)) {
            $values = $results[$key]
            $sorted = [double[]]($values | Sort-Object)
            Write-Output ("STATS {0} median {1:F2} lowest {2:F2} highest {3:F2} q1 {4:F2} q3 {5:F2} n {6}" -f `
              $key, (Get-Quantile $sorted 0.5), $sorted[0], $sorted[-1], `
              (Get-Quantile $sorted 0.25), (Get-Quantile $sorted 0.75), $sorted.Count)
            Write-Output ("VALUES {0} {1}" -f $key, (($values | ForEach-Object { '{0:F2}' -f $_ }) -join ' '))
          }
          $pairs = @(
            @('DD', 'h0', 'm0'),
            @('IPI', 'h0', 'm0'),
            @('IPI', 'hm', 'm0'),
            @('IPI', 'h0', 'hm')
          )
          foreach ($p in $pairs) {
            $a = $results["$($p[0]) $($p[1])"]
            $b = $results["$($p[0]) $($p[2])"]
            $wins = 0
            for ($i = 0; $i -lt $rounds; $i++) { if ($a[$i] -gt $b[$i]) { $wins++ } }
            Write-Output ("WINS {0} {1} better than {2} in {3} of {4} rounds" -f $p[0], $p[1], $p[2], $wins, $rounds)
          }
