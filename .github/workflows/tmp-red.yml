name: Temporary red run tmp/node-62-red2
on:
  push:
    branches:
      - 'tmp/node-62-red2'
jobs:
  Test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init pipeline/fiftyone.pipeline.core/javascript-templates
